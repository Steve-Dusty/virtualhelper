[project]
name = "classroom-agent"
version = "0.1.0"
description = "LiveKit agent for classroom conversation analysis"
requires-python = ">=3.9"
dependencies = [
    "livekit-agents>=0.8.0",
    "livekit-plugins-openai>=0.6.0",
    "livekit-plugins-deepgram>=0.6.0",
    "livekit-plugins-silero>=0.6.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
